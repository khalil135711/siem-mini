[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minisiem"
version = "0.1.0"
description = "Mini-SIEM: Log-Normalisierung, YAML-Detection-Rules, MITRE-Mapping, HTML-Report"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = {text = "MIT"}

[project.scripts]
minisiem = "minisiem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
